<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memhub · 记忆管理</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff' stroke='%23e2e8f0' stroke-width='2'/%3E%3Cg stroke='%230284c7' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M29 18a6 6 0 0 0-10 3 6.5 6.5 0 0 0-3 11 6.5 6.5 0 0 0 2 11 6 6 0 0 0 11 3V18Z'/%3E%3Cpath d='M21 26c2 0 4 1.5 4 3.5M20 37c2.5 0 4.5-1.5 5-3.5'/%3E%3Cpath d='M18 18L10 10M10 16V10h6'/%3E%3Cpath d='M18 46L10 54M16 54h-6v-6'/%3E%3C/g%3E%3Cg stroke='%237c3aed' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M35 18a6 6 0 0 1 10 3 6.5 6.5 0 0 1 3 11 6.5 6.5 0 0 1-2 11 6 6 0 0 1-11 3V18Z'/%3E%3Cpath d='M43 26c-2 0-4 1.5-4 3.5M44 37c-2.5 0-4.5-1.5-5-3.5'/%3E%3Cpath d='M46 18l8-8M48 10h6v6'/%3E%3Cpath d='M46 46l8 8M54 48v6h-6'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --hover: #f1f3f6;
    --active: #eef2ff;
    --active-text: #1d4ed8;
    --line: #e5e7eb;
    --line-strong: #d1d5db;
    --text: #111827;
    --text-sec: #4b5563;
    --dim: #6b7280;
    --muted: #9ca3af;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --radius: 10px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC",
          "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-columns: 248px 1fr;
    height: 100vh;
    overflow: hidden;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 16px 12px 28px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px 14px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .brand svg { width: 24px; height: 24px; flex-shrink: 0; }
  aside h2 {
    font-size: 11px;
    color: var(--muted);
    margin: 18px 10px 6px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  aside h2:first-of-type { margin-top: 10px; }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    margin: 1px 0;
    border-radius: 7px;
    cursor: pointer;
    color: var(--text-sec);
    font-size: 13px;
    transition: background 0.12s, color 0.12s;
    user-select: none;
  }
  .nav .nav-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nav:hover { background: var(--hover); color: var(--text); }
  .nav.on {
    background: var(--active);
    color: var(--active-text);
    font-weight: 500;
  }
  .nav .cnt {
    font-size: 12px;
    color: var(--muted);
    margin-left: 8px;
    font-variant-numeric: tabular-nums;
  }
  .nav.on .cnt { color: var(--active-text); opacity: 0.8; }

  main {
    overflow-y: auto;
    padding: 0 32px 64px;
  }
  .container {
    max-width: 920px;
    margin: 0 auto;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    padding: 16px 0 12px;
    background: rgba(247, 248, 250, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .search-wrap {
    flex: 1;
    min-width: 240px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    width: 15px;
    height: 15px;
    color: var(--muted);
    pointer-events: none;
  }
  input[type=search] {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: var(--shadow-sm);
  }
  input[type=search]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  button {
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    color: var(--text-sec);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
    box-shadow: var(--shadow-sm);
  }
  button:hover {
    background: var(--hover);
    color: var(--text);
    border-color: #cbd5e1;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.danger {
    color: var(--danger);
    border-color: #fecaca;
    background: #fff;
  }
  button.danger:hover {
    background: var(--danger-bg);
    border-color: #fca5a5;
  }
  label.chk {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-sec);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    padding: 4px 6px;
  }
  label.chk input { accent-color: var(--accent); cursor: pointer; }
  .summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--dim);
    margin: 0 0 12px;
    font-size: 12.5px;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .card:hover { border-color: var(--line-strong); }
  .card.open { box-shadow: var(--shadow-md); border-color: #cbd5e1; }
  .card.old { opacity: 0.62; background: #fcfcfd; }
  .card.hit { border-color: #93c5fd; }
  .head {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 13px 16px;
    cursor: pointer;
    user-select: none;
  }
  .chev {
    color: var(--muted);
    font-size: 11px;
    line-height: 22px;
    width: 12px;
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .card.open .chev { transform: rotate(90deg); color: var(--text-sec); }
  .head-main { flex: 1; min-width: 0; }
  .head-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .title {
    flex: 1;
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card.open .title {
    -webkit-line-clamp: unset;
    overflow: visible;
    font-weight: 500;
  }
  .tag {
    font-size: 11.5px;
    font-weight: 500;
    padding: 1px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #f3f4f6;
    color: var(--text-sec);
    white-space: nowrap;
    flex-shrink: 0;
    line-height: 1.6;
  }
  .tag.k-procedure { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .tag.k-fact      { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .tag.k-profile   { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
  .tag.k-intention { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .tag.k-raw       { background: #f3f4f6; color: #4b5563; border-color: #e5e7eb; }
  .tag.k-schema, .tag.k-summary, .tag.k-preference {
    background: #eef2ff; color: #4338ca; border-color: #c7d2fe;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
  }
  .meta-item { display: inline-flex; align-items: center; gap: 4px; }
  .meta-sep { color: #d1d5db; }
  .badge-state {
    font-size: 11px;
    padding: 0 6px;
    border-radius: 4px;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
  }
  .body {
    padding: 12px 16px 16px 38px;
    border-top: 1px solid var(--line);
    background: #fafbfc;
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .body h4 {
    margin: 12px 0 6px;
    font-size: 11.5px;
    color: var(--dim);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .body h4:first-child { margin-top: 2px; }
  .body pre {
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0 0 10px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: var(--text);
  }
  .files-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .file-pill {
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 3px 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text-sec);
  }
  .body textarea {
    width: 100%;
    min-height: 150px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 10px 12px;
    font: 13.5px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    outline: none;
    resize: vertical;
  }
  .body textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .chain {
    border-left: 2px solid var(--line-strong);
    padding-left: 12px;
    margin: 6px 0 10px;
  }
  .chain div {
    margin: 5px 0;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chain .cur { color: var(--text); font-weight: 500; }
  .chain .past { color: var(--muted); text-decoration: line-through; }
  details.src {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    margin-bottom: 6px;
  }
  details.src summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-sec);
    user-select: none;
  }
  details.src pre {
    margin-top: 8px;
    margin-bottom: 2px;
    border: none;
    background: #f8fafc;
  }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .empty {
    color: var(--muted);
    padding: 64px 20px;
    text-align: center;
    background: var(--panel);
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius);
  }
  .login {
    max-width: 460px;
    margin: 120px auto;
    padding: 28px 32px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
  }
  .login h2 { margin: 0 0 8px; font-size: 17px; }
  .login p { margin: 0; color: var(--text-sec); }
  .login code {
    background: #f3f4f6;
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 13px;
  }
  #toast {
    position: fixed;
    right: 24px;
    bottom: 24px;
    background: #1f2937;
    color: #fff;
    padding: 9px 15px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    display: none;
    z-index: 100;
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { display: none; }
    main { padding: 0 16px 48px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
const KIND = {
  procedure: "工程经验",
  fact: "事实",
  profile: "画像",
  intention: "待办意图",
  raw: "原始对话",
  schema: "归纳",
  summary: "摘要",
  preference: "偏好",
};

const LOGO_SVG = `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><g stroke="#0284c7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M29 18a6 6 0 0 0-10 3 6.5 6.5 0 0 0-3 11 6.5 6.5 0 0 0 2 11 6 6 0 0 0 11 3V18Z"/><path d="M21 26c2 0 4 1.5 4 3.5M20 37c2.5 0 4.5-1.5 5-3.5"/><path d="M18 18L10 10M10 16V10h6"/><path d="M18 46L10 54M16 54h-6v-6"/></g><g stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M35 18a6 6 0 0 1 10 3 6.5 6.5 0 0 1 3 11 6.5 6.5 0 0 1-2 11 6 6 0 0 1-11 3V18Z"/><path d="M43 26c-2 0-4 1.5-4 3.5M44 37c-2.5 0-4.5-1.5-5-3.5"/><path d="M46 18l8-8M48 10h6v6"/><path d="M46 46l8 8M54 48v6h-6"/></g></svg>`;
const SEARCH_SVG = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4" stroke-linecap="round"/></svg>`;

const state = {
  token: "",
  rows: [],
  byId: {},
  project: "*",
  source: "*",
  kind: "*",
  text: "",
  history: false,
  hits: null,
  semanticQuery: "",
  open: new Set(),
  editing: null,
  shellMounted: false,
  composing: false,
};

function readToken() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const fromHash = hash.get("token");
  if (fromHash) {
    sessionStorage.setItem("hub-token", fromHash);
    history.replaceState(null, "", location.pathname);
  }
  return fromHash || sessionStorage.getItem("hub-token") || "";
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    body: body === undefined ? undefined : JSON.stringify(body),
    headers: {
      "Authorization": "Bearer " + state.token,
      "Content-Type": "application/json",
    },
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || res.status);
  }
  return res.json();
}

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.style.display = "none"; }, 2400);
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const base = p => p ? p.replace(/\/+$/, "").split("/").pop() : "未归属项目";
const srcName = s => s || "手动/未标来源";
const day = t => t ? new Date(t * 1000).toLocaleString("zh-CN", { hour12: false }) : "";

function title(row) {
  if (row.procedure) return row.procedure.task;
  if (row.kind === "raw") {
    const m = row.content.match(/\[user\]:\s*([\s\S]*?)(?=\n\[(?:assistant|user)\]:|$)/);
    return (m ? m[1] : row.content).trim().slice(0, 180);
  }
  return row.content;
}

async function load() {
  const data = await api("GET", "/v1/hub/memories");
  state.rows = data.memories;
  state.byId = Object.fromEntries(state.rows.map(r => [r.id, r]));
  render();
}

function visible() {
  const text = state.hits ? "" : state.text.trim().toLowerCase();
  return state.rows.filter(r =>
    (state.history || r.is_latest) &&
    (state.project === "*" || r.project === state.project) &&
    (state.source === "*" || r.source === state.source) &&
    (state.kind === "*" || r.kind === state.kind) &&
    (!state.hits || state.hits.has(r.id)) &&
    (!text || (
      r.content + " " + r.project + " " + r.source + " " + r.session_id + " " + r.id + " " +
      (r.procedure ? r.procedure.task + " " + r.procedure.solution : "")
    ).toLowerCase().includes(text))
  );
}

function counts(key, rows, current = "*") {
  const out = {};
  for (const r of rows) out[r[key]] = (out[r[key]] || 0) + 1;
  if (current !== "*" && !(current in out)) out[current] = 0;
  return Object.entries(out).sort((a, b) => b[1] - a[1]);
}

function nav(label, value, current, n, attr) {
  return `<div class="nav ${value === current ? "on" : ""}" data-${attr}="${esc(value)}" title="${esc(value || label)}">
    <span class="nav-label">${esc(label)}</span><span class="cnt">${n}</span>
  </div>`;
}

function chain(row) {
  const older = [], seen = new Set([row.id]);
  let cur = row;
  while (cur.supersedes.length) {
    const prev = state.byId[cur.supersedes[0]];
    if (!prev || seen.has(prev.id)) break;
    seen.add(prev.id);
    older.unshift(prev);
    cur = prev;
  }
  const newer = [];
  cur = row;
  while (cur.superseded_by.length) {
    const next = state.byId[cur.superseded_by[0]];
    if (!next || seen.has(next.id)) break;
    seen.add(next.id);
    newer.push(next);
    cur = next;
  }
  const all = [...older, row, ...newer];
  if (all.length < 2) return "";
  return `<h4>版本历史（旧 → 新）</h4><div class="chain">${all.map(v =>
    `<div class="${v.is_latest ? "cur" : "past"}">${esc(day(v.at))}　${esc(title(v))}</div>`
  ).join("")}</div>`;
}

function detail(row) {
  if (state.editing === row.id) {
    const value = row.procedure ? row.procedure.solution : row.content;
    return `<div class="body">
      <h4>${row.procedure ? "修改方案（任务描述保持不变）" : "修改内容"}</h4>
      <textarea id="edit-${esc(row.id)}">${esc(value)}</textarea>
      <div class="actions">
        <button class="primary" data-save="${esc(row.id)}">保存为新版本</button>
        <button data-cancel="${esc(row.id)}">取消</button>
      </div>
    </div>`;
  }
  const p = row.procedure;
  let html = "";
  if (p) {
    html += `<h4>解决方案</h4><pre>${esc(p.solution)}</pre>`;
    if (p.files && p.files.length) {
      html += `<h4>涉及文件</h4><div class="files-list">${p.files.map(f => `<span class="file-pill">${esc(f)}</span>`).join("")}</div>`;
    }
    if (p.boundary_envs) {
      html += `<h4>适用条件</h4><pre>${esc(p.boundary_envs)}</pre>`;
    }
  } else {
    html += `<pre>${esc(row.content)}</pre>`;
  }
  html += chain(row);
  const sources = row.source_ids.map(id => state.byId[id]).filter(Boolean);
  if (sources.length) {
    html += `<h4>来源对话</h4>` + sources.map(s =>
      `<details class="src"><summary>${esc(day(s.at))} · ${esc(title(s))}</summary><pre>${esc(s.content)}</pre></details>`
    ).join("");
  }
  if (row.is_latest) {
    html += `<div class="actions">
      ${row.kind !== "raw" ? `<button data-edit="${esc(row.id)}">编辑</button>` : ""}
      <button class="danger" data-del="${esc(row.id)}">删除</button>
    </div>`;
  }
  return `<div class="body">${html}</div>`;
}

function card(row) {
  const isOpen = state.open.has(row.id);
  const stateLabel = row.is_latest ? "" : (row.deleted ? "已删除" : "历史版本");
  const isHit = state.hits && state.hits.has(row.id);
  return `<div class="card ${isOpen ? "open" : ""} ${row.is_latest ? "" : "old"} ${isHit ? "hit" : ""}" data-card="${esc(row.id)}">
    <div class="head" data-toggle="${esc(row.id)}">
      <span class="chev">▸</span>
      <span class="tag k-${esc(row.kind)}">${esc(KIND[row.kind] || row.kind)}</span>
      <div class="head-main">
        <div class="head-top">
          <span class="title">${esc(title(row))}</span>
        </div>
        <div class="meta">
          <span class="meta-item">${esc(base(row.project))}</span>
          <span class="meta-sep">·</span>
          <span class="meta-item">${esc(row.source || "—")}</span>
          <span class="meta-sep">·</span>
          <span class="meta-item">${esc(day(row.at))}</span>
          ${stateLabel ? `<span class="badge-state">${stateLabel}</span>` : ""}
        </div>
      </div>
    </div>
    ${isOpen ? detail(row) : ""}
  </div>`;
}

function mountShell() {
  if (state.shellMounted) return;
  const root = document.getElementById("root");
  root.innerHTML = `<div class="app">
    <aside id="sidebar"></aside>
    <main id="main-scroll">
      <div class="container">
        <div class="bar">
          <div class="search-wrap">
            ${SEARCH_SVG}
            <input type="search" id="q" placeholder="输入关键词、来源工具（如 agentica）或会话/记忆 ID 即时筛选；按回车语义搜索">
          </div>
          <span id="clear-slot"></span>
          <label class="chk"><input type="checkbox" id="hist"> 显示历史版本</label>
          <button data-reload="1">刷新</button>
        </div>
        <div class="summary" id="summary"></div>
        <div id="list"></div>
      </div>
    </main>
  </div>`;
  state.shellMounted = true;

  const q = document.getElementById("q");
  q.addEventListener("compositionstart", () => { state.composing = true; });
  q.addEventListener("compositionend", () => {
    state.composing = false;
    onSearchInput(q.value);
  });
  q.addEventListener("input", () => {
    if (!state.composing) onSearchInput(q.value);
  });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter" && !state.composing) {
      e.preventDefault();
      semantic(q.value);
    }
  });
  document.getElementById("hist").addEventListener("change", e => {
    state.history = e.target.checked;
    render();
  });
}

function onSearchInput(val) {
  state.text = val;
  if (state.hits && val.trim() !== state.semanticQuery) {
    state.hits = null;
    state.semanticQuery = "";
  }
  renderContent(false);
}

function updateCardInPlace(id) {
  const row = state.byId[id];
  const el = document.querySelector(`[data-card="${CSS.escape(id)}"]`);
  if (!row || !el) {
    renderContent(false);
    return;
  }
  const tpl = document.createElement("template");
  tpl.innerHTML = card(row).trim();
  el.replaceWith(tpl.content.firstChild);
  if (state.editing === id) {
    const ta = document.getElementById("edit-" + id);
    if (ta) ta.focus();
  }
}

function renderSidebar() {
  const scoped = state.rows.filter(r => state.history || r.is_latest);
  const inSource = scoped.filter(r => state.source === "*" || r.source === state.source);
  const inProject = scoped.filter(r => state.project === "*" || r.project === state.project);
  const inBoth = inProject.filter(r => state.source === "*" || r.source === state.source);
  const sidebar = document.getElementById("sidebar");
  const prevScroll = sidebar.scrollTop;
  sidebar.innerHTML = `
    <div class="brand">${LOGO_SVG}<span>memhub</span></div>
    <h2>项目</h2>
    ${nav("全部", "*", state.project, inSource.length, "project")}
    ${counts("project", inSource, state.project).map(([p, n]) => nav(base(p), p, state.project, n, "project")).join("")}
    <h2>来源工具</h2>
    ${nav("全部", "*", state.source, inProject.length, "source")}
    ${counts("source", inProject, state.source).map(([s, n]) => nav(srcName(s), s, state.source, n, "source")).join("")}
    <h2>类型</h2>
    ${nav("全部", "*", state.kind, inBoth.length, "kind")}
    ${counts("kind", inBoth, state.kind).map(([k, n]) => nav(KIND[k] || k, k, state.kind, n, "kind")).join("")}
  `;
  sidebar.scrollTop = prevScroll;
}

function renderContent(resetScroll) {
  const rows = visible();
  const clearSlot = document.getElementById("clear-slot");
  clearSlot.innerHTML = state.hits ? `<button data-clear="1">清除语义结果</button>` : "";

  const summary = document.getElementById("summary");
  const projLabel = state.project === "*" ? "全部项目" : base(state.project);
  const srcLabel = state.source === "*" ? "全部来源" : srcName(state.source);
  const kindLabel = state.kind === "*" ? "全部类型" : (KIND[state.kind] || state.kind);
  summary.innerHTML = `<span>${esc(projLabel)} · ${esc(srcLabel)} · ${esc(kindLabel)} · 共 <b>${rows.length}</b> 条${state.hits ? `（语义搜索："${esc(state.semanticQuery)}"）` : ""}</span>`;

  const mainEl = document.getElementById("main-scroll");
  const prevScroll = mainEl.scrollTop;
  const listEl = document.getElementById("list");
  listEl.innerHTML = rows.length
    ? rows.slice(0, 500).map(card).join("")
    : `<div class="empty">没有匹配的记忆</div>`;
  if (resetScroll) {
    mainEl.scrollTop = 0;
  } else {
    mainEl.scrollTop = prevScroll;
  }
}

function render(resetScroll = false) {
  const root = document.getElementById("root");
  if (!state.token) {
    state.shellMounted = false;
    root.innerHTML = `<div class="login">
      <h2>需要 Hub 访问令牌</h2>
      <p>请在终端运行 <code>memhub ui</code>，会自动携带令牌打开此页面。</p>
    </div>`;
    return;
  }
  mountShell();
  const q = document.getElementById("q");
  if (document.activeElement !== q && q.value !== state.text) {
    q.value = state.text;
  }
  document.getElementById("hist").checked = state.history;
  renderSidebar();
  renderContent(resetScroll);
}

async function semantic(query) {
  const q = query.trim();
  if (!q) return;
  toast("正在检索…");
  const data = await api("POST", "/v1/hub/recall", {
    query: q,
    limit: 20,
    raw_limit: 5,
    procedure_limit: 10,
    workspace: state.project === "*" ? null : state.project,
  });
  const ids = new Set();
  for (const group of Object.values(data.memories)) {
    for (const item of group) ids.add(item.memory_id);
  }
  for (const item of data.conversations) ids.add(item.memory_id);
  state.hits = ids;
  state.semanticQuery = q;
  state.text = q;
  render(true);
  toast(`语义检索命中 ${ids.size} 条`);
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-project],[data-source],[data-kind],[data-toggle],[data-edit],[data-del],[data-save],[data-cancel],[data-reload],[data-clear]");
  if (!t) return;
  const d = t.dataset;
  try {
    if (d.project !== undefined) {
      state.project = d.project;
      state.kind = "*";
      render(true);
    } else if (d.source !== undefined) {
      state.source = d.source;
      state.kind = "*";
      render(true);
    } else if (d.kind !== undefined) {
      state.kind = d.kind;
      render(true);
    } else if (d.toggle) {
      if (state.open.has(d.toggle)) {
        state.open.delete(d.toggle);
        if (state.editing === d.toggle) state.editing = null;
      } else {
        state.open.add(d.toggle);
      }
      updateCardInPlace(d.toggle);
    } else if (d.edit) {
      state.editing = d.edit;
      state.open.add(d.edit);
      updateCardInPlace(d.edit);
    } else if (d.cancel) {
      const id = d.cancel;
      state.editing = null;
      updateCardInPlace(id);
    } else if (d.clear) {
      state.hits = null;
      state.semanticQuery = "";
      state.text = "";
      document.getElementById("q").value = "";
      render(false);
    } else if (d.reload) {
      await load();
      toast("已刷新");
    } else if (d.save) {
      const content = document.getElementById("edit-" + d.save).value;
      const res = await api("PUT", "/v1/hub/memories/" + d.save, { content });
      state.editing = null;
      state.open.delete(d.save);
      state.open.add(res.memory_id);
      await load();
      toast("已保存为新版本，会自动同步到其他设备");
    } else if (d.del) {
      if (!confirm("删除这条记忆？它会归档在历史版本里，并同步到其他设备。")) return;
      await api("DELETE", "/v1/hub/memories/" + d.del);
      state.open.delete(d.del);
      await load();
      toast("已删除");
    }
  } catch (err) {
    toast("失败：" + err.message);
  }
});

state.token = readToken();
if (state.token) {
  load().catch(err => {
    state.shellMounted = false;
    document.getElementById("root").innerHTML = `<div class="login">
      <h2>连接 Hub 失败</h2>
      <p>${esc(err.message)}</p>
    </div>`;
  });
} else {
  render();
}
</script>
</body>
</html>
