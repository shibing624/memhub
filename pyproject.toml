[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memhub"
version = "0.2.3"
description = "MemHub: Personal Memory Hub & Dual-System Layered Memory SDK for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    # MemHub rewrites host YAML configs (agentica, hermes) keeping comments.
    "ruamel.yaml>=0.18",
    "openai>=1.30",
    "httpx>=0.27",
    "chromadb>=1.0",
    "kuzu>=0.4",
    "numpy>=1.26",
    # System 2 digest clusters facts with average-linkage (dual mode).
    "scikit-learn>=1.4",
    # DeepSeek Harness stores its sessions as zstd-compressed JSONL.
    "zstandard>=0.22",
]

[project.optional-dependencies]
# REST API & Hub Core (`memhub serve-api`, `memhub serve`, `from memhub.api import create_app`)
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# CLI (`memhub add|search|...`)
cli = [
    "typer>=0.12",
]
# MCP server (`memhub-mcp`, `memhub mcp`)
mcp = [
    "mcp>=2.2,<3",
]
# agentica integration (`memhub.integrations.agentica`)
agentica = [
    "agentica",
]
# Tests import `agentica.workspace` to verify the adapter forwards every native method.
# Without this extra those tests can only fail (or silently skip) on a clean checkout.
test = [
    "agentica",
    # Pins the embedding byte cap against a real tokenizer (tests/test_embedding.py).
    "tiktoken",
]
# All optional frontends
all = [
    "memhub[api,cli,mcp]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
    "memhub[all,test]",
]

[project.scripts]
memhub = "memhub.cli.main:app"
memhub-mcp = "memhub.mcp.server:main"
memhub-hook = "memhub.integrations.claude_code:main"

[tool.setuptools.packages.find]
include = ["memhub*"]

[tool.setuptools.package-data]
memhub = ["config.default.yaml", "hub/ui.html", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "benchmark: opt-in recall regression harness; skipped by default. Run with `pytest -m benchmark`.",
]
